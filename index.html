let fallbackSession=false;

 e.preventDefault();const form=e.currentTarget||e.target;if(form.dataset.saving==='1')return;

 if(invalid){formError('필수 정보를 모두 입력해 주세요.');invalid.focus();return}
 const b=e.submitter||form.querySelector('button[type=submit],button:not([type])');
 form.dataset.saving='1';if(b)b.disabled=true;
 try{await fn(formData(form),form)}
 catch(error){console.error('GIRIGIRI 저장 오류:',error);formError('처리 중 오류가 발생했습니다. 입력값을 확인하고 다시 시도해 주세요.')}

function inventory(){let items=state.items.filter(i=>(category==='전체'||i.category===category)&&(`${i.name} ${i.category} ${i.description}`).toLowerCase().includes(search.toLowerCase()));return `${titleBar('물품 관리',`<button class="btn small" onclick="editItem()">＋ 물품 추가</button>`)}<div class="notice">장소별 보관 수량과 대여 수량을 따로 관리합니다. 대여 시 보관 장소의 재고가 차감되고, 반납 시 지정 장소에 재입고됩니다.</div><div class="card"><div class="search-row"><div class="field" style="margin:0"><label for="search">물품명·카테고리 검색</label><input id="search" placeholder="예: 마이크, 음향" value="${esc(search)}" oninput="search=this.value;updateInventoryResults()"></div>${selectField('분류 필터','cat',['전체',...CATS],category).replace('id="f_cat"','id="f_cat" onchange="category=this.value;updateInventoryResults()"')}</div><div class="row" style="margin-top:10px"><button class="btn ghost small" onclick="search='';category='전체';render()">검색 초기화</button><button class="btn secondary small" onclick="categoryManager()">분류 관리</button><button class="btn secondary small" onclick="inventoryTab='reservations';render()">예약 명단 (${state.reservations.length})</button><button class="btn secondary small" onclick="inventoryTab='loans';render()">대여 명단 (${state.loans.length})</button></div></div><div class="subnav">${[['list','전체 물품'],['loans','대여 현황'],['reservations','예약 대기'],['returns','최근 반납']].map(([id,name])=>`<button class="${inventoryTab===id?'active':''}" onclick="inventoryTab='${id}';render()">${name}</button>`).join('')}</div><div id="inventory-results">${inventoryTab==='list'?`<div class="grid two">${items.map(itemCard).join('')}</div>${!items.length?`<div class="card empty">일치하는 물품이 없어요.<br><button class="btn secondary" onclick="search='';category='전체';render()">검색 초기화</button></div>`:''}`:inventorySub()}</div>`}

function categoryManager(){
 dialog('분류 필터 관리',`<p class="muted">새 분류를 만들거나 기존 분류 이름을 바꿀 수 있습니다. 삭제는 해당 분류의 물품이 없을 때만 가능합니다.</p>
 <div class="list-tight" style="margin:12px 0">${CATS.map(c=>`<div class="item row between"><b>${esc(c)}</b><div class="row"><button class="btn secondary small" onclick="categoryRenameForm(${esc(JSON.stringify(c))})">이름 변경</button><button class="btn danger small" onclick="categoryDeleteForm(${esc(JSON.stringify(c))})">삭제</button></div></div>`).join('')}</div>
 <form onsubmit="handleForm(event,addCategory)">${field('새 카테고리 이름','categoryName','')}<div class="row"><button class="btn">분류 추가 저장</button><button type="button" class="btn ghost" onclick="closeDialog()">닫기</button></div></form>`)
}
function addCategory(d){let name=d.categoryName.trim();if(!name||name.length>24){formError('분류 이름을 1~24자로 입력해 주세요.');return}if(CATS.includes(name)){formError('이미 존재하는 분류입니다.');return}CATS.push(name);record('카테고리 추가',name);closeDialog();commit('분류가 추가되었습니다.')}
function categoryRenameForm(old){dialog('분류 이름 변경',`<form onsubmit="handleForm(event,d=>renameCategory(d,${esc(JSON.stringify(old))}))">${field('새 분류 이름','categoryName',old)}<div class="row"><button class="btn">변경 저장</button><button type="button" class="btn ghost" onclick="categoryManager()">취소</button></div></form>`)}
function renameCategory(d,old){let name=d.categoryName.trim();if(!name||name.length>24||name!==old&&CATS.includes(name)){formError('이름이 비어 있거나 이미 존재하는 분류입니다 (최대 24자).');return}let idx=CATS.indexOf(old);if(idx<0)return;CATS[idx]=name;state.items.forEach(i=>{if(i.category===old)i.category=name});if(category===old)category=name;record('카테고리 이름 변경',old+' → '+name);closeDialog();commit('분류 이름이 변경되었습니다.')}
function categoryDeleteForm(name){let count=state.items.filter(i=>i.category===name).length;dialog('분류 삭제',`<p><b>${esc(name)}</b> 분류를 정말 삭제하시겠습니까?</p>${count?`<div class="notice warning">이 분류에 등록된 물품이 ${count}종류 있습니다. 물품의 카테고리를 먼저 다른 분류로 변경해 주세요.</div>`:''}<div class="row" style="margin-top:15px"><button class="btn danger" onclick="deleteCategory(${esc(JSON.stringify(name))})" ${count||CATS.length<=1?'disabled':''}>예, 삭제</button><button class="btn ghost" onclick="categoryManager()">아니오</button></div>`)}
function deleteCategory(name){if(CATS.length<=1||state.items.some(i=>i.category===name)){formError('등록 물품이 있는 분류 또는 마지막 분류는 삭제할 수 없습니다.');return}let idx=CATS.indexOf(name);if(idx<0)return;CATS.splice(idx,1);if(category===name)category='전체';record('카테고리 삭제',name);closeDialog();commit('분류를 삭제했습니다.')}
function updateInventoryResults(){const q=el('search'),c=el('f_cat');if(q)search=q.value;if(c)category=c.value;const focus=document.activeElement;const pos=focus===q?q.selectionStart:null;el('inventory-results').innerHTML=inventoryTab==='list'?(()=>{let data=state.items.filter(i=>(category==='전체'||i.category===category)&&(`${i.name} ${i.category} ${i.description}`).toLowerCase().includes(search.toLowerCase()));return `<div class="grid two">${data.map(itemCard).join('')}</div>${!data.length?'<div class="card empty">일치하는 물품이 없어요.<br><button class="btn secondary" onclick="search=\'\';category=\'전체\';render()">검색 초기화</button></div>':''}`})():inventorySub();if(q&&pos!==null){q.focus();q.setSelectionRange(pos,pos)}}
function inventorySub(){let data=inventoryTab==='loans'?state.loans:inventoryTab==='reservations'?state.reservations:state.returns;return data.length?data.map(x=>`<article class="card"><b>${esc(state.items.find(i=>i.id===x.itemId)?.name||x.itemName||'삭제된 물품')}</b> · ${x.qty||1}개<br><small>${esc(x.name)} · ${esc(x.purpose||'반납 완료')} · ${esc(x.date)} ${x.place?'· '+esc(x.place):''}</small><div class="row" style="margin-top:10px">${inventoryTab==='loans'?`<button class="btn small" onclick="returnLoan('${x.id}')">반납</button>`:''}${inventoryTab==='reservations'?`<button class="btn danger small" onclick="cancelReservation('${x.id}')">예약 취소</button>`:''}</div></article>`).join(''):'<div class="card empty">아직 등록된 내용이 없습니다.</div>'}
function editItem(id){let i=state.items.find(x=>x.id===id),v=i||{name:'',category:'음향',description:'',total:1,places:{'1층 방송실':1}};dialog(i?'물품 수정':'물품 추가',`<form onsubmit="handleForm(event,d=>saveItem(d,'${id||''}'))">${field('물품명','name',v.name)}${selectField('카테고리','category',CATS,v.category)}${textarea('상세 설명 (선택)','description',v.description,false)}${field('총 수량','total',v.total,'number')}<p class="muted" style="margin:0 0 9px">장소별 현재 보관 수량 (합계는 총 수량에서 대여 중 수량을 뺀 값이어야 합니다.)</p>${LOC.map((l,j)=>field(l,'loc'+j,v.places[l]||0,'number')).join('')}<div class="row"><button class="btn" type="submit">저장</button><button class="btn ghost" type="button" onclick="closeDialog()">취소</button></div></form>`)}
function saveItem(d,id){if(!valid(d,['name','total'])||!whole(d.total)||LOC.some((_,j)=>!whole(d['loc'+j]))){formError('필수 정보를 채우고, 수량에는 0 이상의 정수를 입력해 주세요.');return}let occupied=LOC.reduce((s,_,j)=>s+Number(d['loc'+j]),0),borrowed=id?inLoan(id):0;if(occupied+borrowed!==Number(d.total)){formError(`수량이 일치하지 않아요. 장소별 ${occupied}개 + 대여 중 ${borrowed}개 = 총 ${d.total}개가 되어야 합니다.`);return}const places=Object.fromEntries(LOC.map((l,j)=>[l,Number(d['loc'+j])]));if(id){Object.assign(state.items.find(i=>i.id===id),{name:d.name.trim(),category:d.category,description:d.description.trim(),total:Number(d.total),places})}else{state.items.unshift({id:uid(),name:d.name.trim(),category:d.category,description:d.description.trim(),total:Number(d.total),places})}record(id?'물품 수정':'물품 추가',d.name);closeDialog();commit('저장되었습니다.')}
function deleteItem(id){let i=state.items.find(i=>i.id===id);if(inLoan(id)){toast('대여 중인 물품은 먼저 반납 처리해 주세요.');return}dialog('물품 삭제',`<p><b>${esc(i.name)}</b>을(를) 정말 삭제하시겠습니까?</p><p class="muted">관련 예약은 취소되며, 기존 활동 기록은 남습니다.</p><div class="row" style="margin-top:18px"><button class="btn danger" onclick="confirmDeleteItem('${id}')">예, 삭제</button><button class="btn ghost" onclick="closeDialog()">아니오</button></div>`)}
function confirmDeleteItem(id){state.items=state.items.filter(i=>i.id!==id);state.reservations=state.reservations.filter(r=>r.itemId!==id);record('물품 삭제',id);closeDialog();commit()}
function openItem(id){let i=state.items.find(x=>x.id===id);if(!i)return;dialog(i.name,`<span class="pill ${available(i)?'ok':'bad'}">${available(i)?'대여 가능':'재고 없음'}</span><p style="margin:12px 0">${esc(i.description)}</p><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><small>보유 총 수량</small><strong>${i.total}</strong></div><div class="stat"><small>현재 대여 가능</small><strong>${available(i)}</strong></div></div>${titleBar('장소별 보관 수량')}<div class="tags">${LOC.map(l=>`<span>${esc(l)} · ${i.places[l]||0}개</span>`).join('')}</div><p class="muted">대여 중 ${inLoan(id)}개 · 예약 ${state.reservations.filter(r=>r.itemId===id).length}건</p><div class="row" style="margin-top:16px"><button class="btn" onclick="openLoan('${id}')">${available(i)?'대여하기':'예약하기'}</button><button class="btn secondary" onclick="chooseReturn('${id}')">반납하기</button><button class="btn ghost" onclick="editItem('${id}')">수정</button></div>`)}
function openLoan(id){let i=state.items.find(x=>x.id===id);if(!i)return;if(!available(i)){reserve(id);return}dialog('물품 대여 · '+i.name,`<form onsubmit="handleForm(event,d=>doLoan(d,'${id}'))">${field('대여자 이름','name')}${field('사용 목적','purpose')}${field('대여 수량 (가능 '+available(i)+'개)','qty',1,'number')}${selectField('대여 장소','place',LOC.filter(l=>i.places[l]>0),LOC.find(l=>i.places[l]>0))}${field('대여 날짜','date',today(),'date')}<div class="row"><button class="btn">대여 확정</button><button type="button" class="btn ghost" onclick="closeDialog()">취소</button></div></form>`)}
function doLoan(d,id){let i=state.items.find(x=>x.id===id);if(!valid(d,['name','purpose','date'])||!whole(d.qty)||+d.qty<1){toast('필수 정보를 모두 입력해 주세요.');return}if(+d.qty>available(i)||+d.qty>(i.places[d.place]||0)){formError('현재 재고보다 많은 수량은 대여할 수 없습니다. 해당 장소의 재고를 확인해 주세요.');return}i.places[d.place]-=+d.qty;state.loans.unshift({id:uid(),itemId:id,name:d.name.trim(),purpose:d.purpose.trim(),qty:+d.qty,place:d.place,date:d.date});record('대여',`${i.name} ${d.qty}개 · ${d.name}`);closeDialog();commit('대여가 완료되었습니다.')}
function reserve(id){let i=state.items.find(x=>x.id===id);dialog('예약 신청 · '+i.name,`<div class="notice warning">현재 대여 가능한 재고가 없습니다. 예약하시겠어요? 예약은 자동 대여되지 않으며 재고가 들어오면 직접 처리해야 합니다.</div><form onsubmit="handleForm(event,d=>doReserve(d,'${id}'))">${field('예약자 이름','name')}${field('사용 목적','purpose')}${field('예약 수량','qty',1,'number')}${field('사용 희망 날짜','date',today(),'date')}<div class="row"><button class="btn">예약 등록</button><button type="button" class="btn ghost" onclick="closeDialog()">취소</button></div></form>`)}
function doReserve(d,id){if(!valid(d,['name','purpose','date'])||!whole(d.qty)||+d.qty<1){toast('필수 정보를 모두 입력해 주세요.');return}state.reservations.push({id:uid(),itemId:id,name:d.name.trim(),purpose:d.purpose.trim(),qty:+d.qty,date:d.date,created:Date.now()});record('예약',`${state.items.find(i=>i.id===id).name} · ${d.name}`);closeDialog();commit('예약되었습니다.')}
function cancelReservation(id){dialog('예약 취소',`<p>해당 예약을 취소하시겠습니까?</p><div class="row" style="margin-top:15px"><button class="btn danger" onclick="confirmCancelReservation('${id}')">예</button><button class="btn ghost" onclick="closeDialog()">아니오</button></div>`)}
function confirmCancelReservation(id){state.reservations=state.reservations.filter(r=>r.id!==id);record('예약 취소',id);closeDialog();commit()}

function chooseReturn(itemId){let loans=state.loans.filter(l=>l.itemId===itemId);dialog('반납할 대여 내역 선택',loans.length?loans.map(l=>`<div class="item"><b>${esc(l.name)}</b> · ${l.qty}개<br><small>${esc(l.purpose)} · ${esc(l.date)}</small><div style="margin-top:8px"><button class="btn small" onclick="returnLoan('${l.id}')">이 내역 반납</button></div></div>`).join(''):'<p class="empty">현재 이 물품의 대여 내역이 없습니다.</p>')}
function returnLoan(id){let l=state.loans.find(x=>x.id===id),i=state.items.find(x=>x.id===l?.itemId);if(!l||!i)return;dialog('물품 반납 · '+i.name,`<form onsubmit="handleForm(event,d=>doReturn(d,'${id}'))"><p class="muted">대여자 ${esc(l.name)} · 반납 가능 ${l.qty}개</p>${field('반납 수량','qty',l.qty,'number')}${selectField('반납 장소','place',LOC,l.place)}<div class="row"><button class="btn">반납 확정</button><button type="button" class="btn ghost" onclick="closeDialog()">취소</button></div></form>`)}
function doReturn(d,id){let l=state.loans.find(x=>x.id===id),i=state.items.find(x=>x.id===l.itemId);if(!whole(d.qty)||+d.qty<1||+d.qty>l.qty){formError('반납 수량이 실제 대여 수량보다 많거나 올바르지 않습니다.');return}i.places[d.place]=(i.places[d.place]||0)+ +d.qty;l.qty-=+d.qty;if(l.qty===0)state.loans=state.loans.filter(x=>x.id!==id);state.returns.unshift({id:uid(),itemId:i.id,itemName:i.name,name:l.name,qty:+d.qty,place:d.place,date:today()});record('반납',`${i.name} ${d.qty}개 · ${l.name}`);closeDialog();commit('반납되었습니다. 최근 반납 목록에 반영했습니다.')}
function projects(){return `${titleBar('프로젝트 계획서',`<button class="btn small" onclick="projectForm()">＋ 계획서 제출</button>`)}<div class="notice">계획서와 댓글은 이 브라우저에 저장되며 다른 기기에는 공유되지 않습니다.</div><div class="grid two">${state.projects.map(p=>`<article class="card"><div class="row between"><span class="pill ${p.status==='완료'?'ok':p.status==='진행 중'?'warn':''}">${esc(p.status)}</span><small>${esc(p.date)}</small></div><h3 style="margin:10px 0 3px">${esc(p.title)}</h3><small>제안인 ${esc(p.author)}</small><p class="pre" style="margin:12px 0">${esc(p.detail)}</p><div class="row"><button class="btn small secondary" onclick="projectForm('${p.id}')">계획서 수정</button><button class="btn small ghost" onclick="statusForm('${p.id}')">진행 상태</button><button class="btn small ghost" onclick="commentForm('${p.id}')">댓글 (${p.comments.length})</button></div><div class="divider"></div>${p.comments.map(c=>`<div class="activity"><b>${esc(c.author)}</b> <small>${esc(c.date)}</small><p class="pre">${esc(c.text)}</p><button class="btn ghost small" onclick="editComment('${p.id}','${c.id}')">댓글 수정·삭제</button></div>`).join('')||'<p class="muted">아직 댓글이 없습니다.</p>'}</article>`).join('')}</div>${state.projects.length?'':'<div class="card empty">아직 등록된 내용이 없습니다. 계획서를 추가해 주세요.</div>'}`}
function projectForm(id){let p=state.projects.find(p=>p.id===id)||{title:'',author:'',detail:''};dialog(id?'계획서 수정':'새 계획서 제출',`<form onsubmit="handleForm(event,d=>submitProject(d,'${id||''}'))">${field('프로젝트명','title',p.title)}${field('제안인','author',p.author)}${textarea('상세 내용','detail',p.detail)}<div class="row"><button class="btn">저장</button><button type="button" class="btn ghost" onclick="closeDialog()">취소</button></div></form>`)}
function submitProject(d,id){if(!valid(d,['title','author','detail']))return;if(id){Object.assign(state.projects.find(p=>p.id===id),{title:d.title.trim(),author:d.author.trim(),detail:d.detail.trim()})}else{state.projects.unshift({id:uid(),title:d.title.trim(),author:d.author.trim(),detail:d.detail.trim(),status:'계획 중',date:today(),comments:[]})}record(id?'계획서 수정':'계획서 제출',d.title);closeDialog();commit()}
function statusForm(id){let p=state.projects.find(p=>p.id===id);dialog('진행 상태 변경',`<form onsubmit="handleForm(event,d=>{state.projects.find(p=>p.id==='${id}').status=d.status;record('프로젝트 상태 변경',state.projects.find(p=>p.id==='${id}').title);closeDialog();commit()})">${selectField('진행 단계','status',['계획 중','진행 중','완료'],p.status)}<div class="row"><button class="btn">저장</button><button type="button" class="btn ghost" onclick="closeDialog()">취소</button></div></form>`)}
function commentForm(id){dialog('댓글 작성',`<form onsubmit="handleForm(event,d=>submitComment(d,'${id}'))">${field('작성자','author')}${textarea('댓글','text')}<div class="row"><button class="btn">댓글 게시</button><button type="button" class="btn ghost" onclick="closeDialog()">취소</button></div></form>`)}
function submitComment(d,id){if(!valid(d,['author','text']))return;state.projects.find(p=>p.id===id).comments.push({id:uid(),author:d.author.trim(),text:d.text.trim(),date:today()});record('댓글 작성',d.author);closeDialog();commit()}
function editComment(pid,cid){let c=state.projects.find(p=>p.id===pid).comments.find(c=>c.id===cid);dialog('댓글 수정·삭제',`<form onsubmit="handleForm(event,d=>{if(!valid(d,['author','text']))return;let c=state.projects.find(p=>p.id==='${pid}').comments.find(c=>c.id==='${cid}');c.author=d.author.trim();c.text=d.text.trim();record('댓글 수정',d.author);closeDialog();commit()})">${field('작성자','author',c.author)}${textarea('댓글','text',c.text)}<div class="row"><button class="btn">수정 저장</button><button class="btn danger" type="button" onclick="deleteComment('${pid}','${cid}')">댓글 삭제</button><button class="btn ghost" type="button" onclick="closeDialog()">취소</button></div></form>`)}
function deleteComment(pid,cid){dialog('댓글 삭제',`<p>정말 삭제하시겠습니까?</p><div class="row" style="margin-top:14px"><button class="btn danger" onclick="state.projects.find(p=>p.id==='${pid}').comments=state.projects.find(p=>p.id==='${pid}').comments.filter(c=>c.id!=='${cid}');record('댓글 삭제','프로젝트 댓글');closeDialog();commit()">예</button><button class="btn ghost" onclick="editComment('${pid}','${cid}')">아니오</button></div>`)}
function board(type){let isSong=type==='songs',data=state[type],query=isSong?songSearch:storySearch;let filtered=data.filter(x=>(isSong?`${x.title} ${x.artist} ${x.author}`:`${x.title} ${x.detail} ${x.author}`).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>Number(a.used)-Number(b.used)||b.date.localeCompare(a.date));return `${titleBar(isSong?'신청곡 접수':'사연 접수',`<button class="btn small" onclick="postForm('${type}')">＋ ${isSong?'신청곡':'사연'} 추가</button>`)}<div class="notice">방송에 사용한 게시물은 회색으로 표시되고 목록 맨 아래로 이동합니다. 접수는 현재 시연 기기에서만 가능합니다.</div><div class="card"><div class="field" style="margin:0"><label>게시글 검색</label><input value="${esc(query)}" placeholder="${isSong?'제목·가수·신청자':'제목·내용·작성자'} 검색" oninput="${isSong?'songSearch':'storySearch'}=this.value;updateBoard('${type}',this)"></div><div class="row" style="margin-top:9px"><button class="btn ghost small" onclick="${isSong?'songSearch':'storySearch'}='';render()">초기화</button><span class="counter">총 ${data.length}건</span></div></div><div id="board-results">${boardEntries(type,filtered)}</div>`}
function boardEntries(type,data){let isSong=type==='songs';return data.length?data.map(x=>`<article class="card ${x.used?'used':''}"><div class="row between"><span class="pill ${x.used?'off':'ok'}">${x.used?'방송 사용 완료':'방송 미사용'}</span><small>${esc(x.date)}</small></div><div class="row between" style="align-items:flex-start;margin:10px 0"><div class="grow" style="min-width:0"><h3>${esc(x.title)}</h3><small>${isSong?'가수 '+esc(x.artist):'작성자 '+esc(x.author)}</small>${isSong?`<p class="muted">신청자 ${esc(x.author)}</p>`:`<p class="pre" style="margin-top:7px">${esc(x.detail)}</p>`}</div>${!isSong&&x.image?`<img alt="사연 첨부 이미지" src="${x.image}" style="width:72px;height:72px;object-fit:cover;border-radius:10px">`:''}</div><div class="row"><button class="btn ${x.used?'ghost':'success'} small" onclick="toggleUsed('${type}','${x.id}')">${x.used?'미사용으로 되돌리기':'✓ 사용 완료'}</button><button class="btn secondary small" onclick="postForm('${type}','${x.id}')">수정</button><button class="btn danger small" onclick="deletePost('${type}','${x.id}')">삭제</button></div></article>`).join(''):'<div class="card empty">아직 등록된 내용이 없습니다. 새 게시글을 추가해 주세요.</div>'}
function updateBoard(type,input){if(type==='songs')songSearch=input.value;else storySearch=input.value;let query=type==='songs'?songSearch:storySearch;el('board-results').innerHTML=boardEntries(type,state[type].filter(x=>Object.values(x).some(v=>typeof v==='string'&&!v.startsWith('data:')&&v.toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>Number(a.used)-Number(b.used)||b.date.localeCompare(a.date)))}
function postForm(type,id){let isSong=type==='songs',p=state[type].find(p=>p.id===id)||{};dialog(`${isSong?'신청곡':'사연'} ${id?'수정':'추가'}`,`<form onsubmit="handleForm(event,(d,f)=>submitPost(d,f,'${type}','${id||''}'))">${field('제목','title',p.title||'')}${isSong?field('가수명','artist',p.artist||''):textarea('사연 상세 내용','detail',p.detail||'')}${field(isSong?'신청자 이름 또는 별명':'작성자 이름 또는 별명','author',p.author||'', 'text',false)}${!isSong?`<div class="field"><label>이미지 첨부 (선택 · 최대 1MB)</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp"><small>${p.image?'기존 이미지는 새 이미지 선택 시 교체됩니다.':''}</small></div>`:''}<div class="row"><button class="btn">저장</button><button type="button" class="btn ghost" onclick="closeDialog()">취소</button></div></form>`)}
async function submitPost(d,form,type,id){if(!valid(d,type==='songs'?['title','artist']:['title','detail']))return;let obj=state[type].find(p=>p.id===id)||{id:uid(),used:false,date:today()};obj.title=d.title.trim();obj.author=d.author.trim()||'익명';if(type==='songs')obj.artist=d.artist.trim();else{obj.detail=d.detail.trim();let file=form.querySelector('[name=image]').files[0];if(file){if(file.size>1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('이미지는 PNG/JPG/WEBP 1MB 이하만 가능합니다.');return}obj.image=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}else obj.image=obj.image||''}if(!id)state[type].unshift(obj);record(id?'게시글 수정':'게시글 등록',obj.title);closeDialog();commit()}
function toggleUsed(type,id){let p=state[type].find(x=>x.id===id);p.used=!p.used;record(p.used?'방송 사용 완료':'미사용으로 변경',p.title);commit()}
function deletePost(type,id){dialog('게시글 삭제',`<p>정말 삭제하시겠습니까?</p><div class="row" style="margin-top:15px"><button class="btn danger" onclick="state['${type}']=state['${type}'].filter(p=>p.id!=='${id}');record('게시글 삭제','${type}');closeDialog();commit()">예</button><button class="btn ghost" onclick="closeDialog()">아니오</button></div>`)}
function teams(){
 const roles=['엔지니어·카메라','아나운서','PD'];
 const groups=state.teams;
 const total=groups.reduce((sum,t)=>sum+roles.reduce((s,r)=>s+(t.roles[r]||0),0),0);
 const sizes=groups.map(t=>roles.reduce((s,r)=>s+(t.roles[r]||0),0));
 const balanced=groups.length>0 && roles.every(r=>Math.max(...groups.map(t=>t.roles[r]||0))-Math.min(...groups.map(t=>t.roles[r]||0))<=1) && Math.max(...sizes)-Math.min(...sizes)<=1;
 const header=titleBar('팀 구성','<button class="btn small" onclick="teamForm()">팀 다시 편성하기</button>')+'<p class="muted" style="margin-bottom:17px">역할별 인원을 팀마다 고르게 나눕니다. 이름을 입력하면 각 역할 아래로 직접 배정됩니다.</p>';
 if(!groups.length){return header+'<section class="workspace-panel"><p class="empty">아직 팀이 편성되지 않았어요. 역할별 인원과 팀 수를 입력해 주세요.</p><button class="btn wfull" onclick="teamForm()">팀 편성하기</button></section>';}
 const summary='<div class="team-overview"><span>총 '+total+'명</span><span>'+groups.length+'개 팀</span>'+roles.map(r=>'<span>'+r+' '+groups.reduce((s,t)=>s+(t.roles[r]||0),0)+'명</span>').join('')+'</div>';
 const notice='<p class="team-check">'+(balanced?'✓ 역할별 · 팀 전체 인원 차이 모두 1명 이하':'⚠ 기존 팀 편성을 다시 확인해 주세요.')+'</p>';
 const cards=groups.map((t,j)=>{
  const tTotal=roles.reduce((s,r)=>s+(t.roles[r]||0),0);
  let body='<div class="team-header"><h3>'+esc(t.name)+'</h3><small>총 '+tTotal+'명</small></div>';
  for(const r of roles){
    const ns=t.roleMembers?.[r]||[];
    const values=Array.from({length:t.roles[r]||0},(_,k)=>ns[k]||'');
    body+='<div class="role-line"><strong>'+r+' <span class="muted">'+(t.roles[r]||0)+'명</span></strong><div class="roster-names">';
    body+=values.length?values.map(n=>'<span class="person-chip '+(n?'':'vacant')+'">'+(n?esc(n):'이름 미입력')+'</span>').join(''):'<small>배정 없음</small>';
    body+='</div></div>';
  }
  if(t.members?.length&&!t.roleMembers)body+='<p class="muted" style="margin:9px 0">기존 등록 이름 (역할 미분류): '+esc(t.members.join(', '))+'</p>';
  return '<article class="team-roster">'+body+'<button class="btn ghost small" style="margin-top:13px" onclick="teamMembers('+j+')">역할별 이름 편집</button></article>';
 }).join('');
 const scheduleLink='<section class="workspace-panel" style="margin-top:14px"><h2>일정 연동</h2><p class="muted" style="margin:8px 0 15px;font-size:13px">팀 구성을 완료하면 월별 평일 방송 당번을 자동으로 고르게 분배할 수 있어요.</p><button class="btn ghost" onclick="go(\'schedule\')">월별 일정 열기 →</button></section>';
 return header+summary+notice+'<div class="team-list">'+cards+'</div>'+scheduleLink;
}
function teamForm(){
 const roleFields=[['engineer','엔지니어·카메라',6],['anchor','아나운서',3],['pd','PD',3]];
 dialog('역할별 팀 편성',`<form onsubmit="handleForm(event,createTeams)"><p class="muted" style="margin-bottom:16px">각 역할의 인원과 팀 수를 입력해 주세요. 이름 입력은 선택 사항이며, 한 줄에 한 명씩 적으면 역할에 맞게 배치됩니다.</p>${roleFields.map(([id,label,defaultValue])=>`<div class="role-editor"><h3>${label}</h3>${field('전체 인원',''+id,state.teams.length?state.teams.reduce((s,t)=>s+(t.roles[label]||0),0):defaultValue,'number')}<div class="field"><label for="names_${id}">이름 목록 (선택)</label><textarea id="names_${id}" name="names_${id}" placeholder="부원 이름을 한 줄에 한 명씩 입력해 주세요" rows="2">${esc(state.teams.flatMap(t=>t.roleMembers?.[label]||[]).filter(Boolean).join("\n"))}</textarea></div><span class="field-help">입력하지 않으면 이름 미입력 상태로 인원수만 배정됩니다.</span></div>`).join('')}${field('나눌 팀 수','count',state.teamCount||3,'number')}<div class="notice warning">편성하면 기존 팀 구성이 교체됩니다. 등록된 일정은 유지되므로 팀 수를 변경한 뒤에는 기존 담당 팀을 확인해 주세요.</div><div class="row"><button class="btn" type="submit">역할별로 팀 편성하기</button><button class="btn ghost" type="button" onclick="closeDialog()">취소</button></div></form>`);
}
function createTeams(d){
 const counts=['engineer','anchor','pd','count'];
 if(counts.some(k=>!whole(d[k]))||+d.count<1||+d.count>30||+d.engineer+ +d.anchor+ +d.pd<1||+d.engineer+ +d.anchor+ +d.pd>300){formError('팀 수는 1~30, 전체 인원은 1~300명으로 입력해 주세요.');return}
 const n=Number(d.count),roleInfo=[['engineer','엔지니어·카메라'],['anchor','아나운서'],['pd','PD']];
 const roster={};
 for(const [id,name] of roleInfo){let people=String(d['names_'+id]||'').split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
   if(people.length>Number(d[id])){formError(`${name}: 입력한 이름(${people.length}명)이 설정 인원(${d[id]}명)보다 많아요.`);return}
   roster[name]=people;
 }
 const next=Array.from({length:n},(_,j)=>({name:`${j+1}팀`,roles:{},roleMembers:{},members:[]}));
 // Give each team the base headcount per role first. Then assign each
 // remainder to a team with the fewest total members, rotating tie breaks.
 const totals=Array(n).fill(0);let cursor=0;
 for(const [id,role] of roleInfo){
  const amount=Number(d[id]),base=Math.floor(amount/n),extra=amount%n;
  for(let j=0;j<n;j++){next[j].roles[role]=base;totals[j]+=base;}
  for(let k=0;k<extra;k++){
   let choices=Array.from({length:n},(_,j)=>j).filter(j=>next[j].roles[role]===base);
   choices.sort((a,b)=>totals[a]-totals[b]||((a-cursor+n)%n)-((b-cursor+n)%n));
   let chosen=choices[0];next[chosen].roles[role]++;totals[chosen]++;cursor=(chosen+1)%n;
  }
  let offset=0;
  for(let j=0;j<n;j++){
   const count=next[j].roles[role];
   next[j].roleMembers[role]=Array.from({length:count},()=>roster[role][offset++]||'');
  }
 }
 const ok=roleInfo.every(([,role])=>Math.max(...next.map(t=>t.roles[role]))-Math.min(...next.map(t=>t.roles[role]))<=1)&&Math.max(...totals)-Math.min(...totals)<=1;
 if(!ok){formError('팀 편성 검증에 실패했습니다. 인원을 다시 확인해 주세요.');return}
 const prevCount=state.teamCount;
 state.teams=next;state.teamCount=n;
 // Previously assigned team indexes can become invalid if the count changes.
 if(prevCount!==n)state.schedules.forEach(s=>{if(s.teamIndex>=n)s.teamIndex=-1});
 record('팀 역할별 균등 편성',`${n}개 팀 · 총 ${totals.reduce((a,b)=>a+b,0)}명`);
 closeDialog();commit('역할별 인원이 균등하게 편성되었습니다.');
}
function teamMembers(j){
 const t=state.teams[j];if(!t)return;
 const roles=['엔지니어·카메라','아나운서','PD'];
 dialog(`${t.name} · 역할별 이름 편집`,`<form onsubmit="handleForm(event,d=>saveTeamMembers(d,${j}))"><p class="muted" style="margin-bottom:16px">역할별 배정 인원은 유지되며 이름만 변경됩니다. 인원수를 바꾸려면 팀을 다시 편성해 주세요.</p>${t.members&&t.members.length&&!t.roleMembers?`<div class="notice warning">기존에 역할 구분 없이 저장한 이름: ${esc(t.members.join(', '))}. 해당하는 역할의 칸에 직접 옮겨 입력해 주세요.</div>`:''}${roles.map((r,ri)=>`<div class="role-editor"><h3>${r} · ${t.roles[r]||0}명</h3>${Array.from({length:t.roles[r]||0},(_,k)=>`<div class="field"><label for="member_${ri}_${k}">${k+1}번째 부원</label><input id="member_${ri}_${k}" name="member_${ri}_${k}" maxlength="80" placeholder="이름 (선택)" value="${esc((t.roleMembers&&t.roleMembers[r]&&t.roleMembers[r][k])||'')}"></div>`).join('')||'<p class="muted">이 역할의 배정 인원이 없습니다.</p>'}</div>`).join('')}<div class="row"><button class="btn" type="submit">이름 저장</button><button class="btn ghost" type="button" onclick="closeDialog()">취소</button></div></form>`);
}
function saveTeamMembers(d,j){
 const t=state.teams[j];if(!t)return;
 const roles=['엔지니어·카메라','아나운서','PD'];
 t.roleMembers={};
 roles.forEach((r,ri)=>{t.roleMembers[r]=Array.from({length:t.roles[r]||0},(_,k)=>String(d[`member_${ri}_${k}`]||'').trim())});
 t.members=Object.values(t.roleMembers).flat().filter(Boolean);
 record('역할별 팀원 이름 수정',t.name);closeDialog();commit('팀원 이름을 저장했습니다.');
}
function schedule(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),last=new Date(y,m,0).getDate(),cells=[];for(let x=0;x<first;x++)cells.push('<div></div>');for(let d=1;d<=last;d++){let date=`${month}-${String(d).padStart(2,'0')}`,events=state.schedules.filter(s=>s.date===date);cells.push(`<div class="day"><span class="number">${d}</span>${events.map(e=>`<div class="event ${e.teamIndex>=0?'team'+(e.teamIndex%6+1):''}">${esc(e.title)}${e.teamIndex>=0?' · '+(e.teamIndex+1)+'팀':''}<button title="일정 삭제" aria-label="${esc(e.title)} 삭제" onclick="deleteSchedule('${e.id}')">×</button></div>`).join('')}</div>`)}return `${titleBar('팀 일정 달력',`<button class="btn small" onclick="scheduleForm()">＋ 일정 추가</button>`)}<div class="notice">월별 팀 자동 편성은 평일(월~금)에 한정되며 공휴일·학교 휴업일은 자동 제외되지 않습니다. 실제 방송일은 담당자가 확인해 주세요.</div><div class="card"><div class="row between" style="margin-bottom:14px"><button class="btn ghost small" onclick="moveMonth(-1)">‹ 이전 달</button><h3>${y}년 ${m}월</h3><button class="btn ghost small" onclick="moveMonth(1)">다음 달 ›</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="daylabel">${x}</div>`).join('')}${cells.join('')}</div><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="autoSchedule()">평일 팀 일정 자동 생성</button><button class="btn ghost" onclick="scheduleForm()">날짜별 일정 추가</button></div></div><section class="card">${titleBar('이번 달 일정 목록')}<div class="list-tight">${state.schedules.filter(s=>s.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>`<div class="item row between"><span><b>${esc(s.date)}</b> · ${esc(s.title)} ${s.teamIndex>=0?`(${s.teamIndex+1}팀)`:''}</span><button class="btn danger small" onclick="deleteSchedule('${s.id}')">삭제</button></div>`).join('')||'<p class="empty">아직 등록된 내용이 없습니다.</p>'}</div></section>`}
function moveMonth(n){let [y,m]=month.split('-').map(Number);month=isoDate(new Date(y,m-1+n,1)).slice(0,7);render()}
function scheduleForm(){dialog('일정 추가',`<form onsubmit="handleForm(event,saveSchedule)">${field('날짜','date',today(),'date')}${field('일정 이름','title','방송 당번')}${selectField('담당 팀','team',['미지정',...state.teams.map(t=>t.name)],'미지정')}${selectField('반복 주기','repeat',['반복 안 함','매주','2주마다','매월'],'반복 안 함')}${field('반복 횟수 (첫 일정 포함, 최대 24)','times',1,'number')}<div class="row"><button class="btn">일정 저장</button><button type="button" class="btn ghost" onclick="closeDialog()">취소</button></div></form>`)}
function saveSchedule(d){if(!valid(d,['date','title'])||!whole(d.times)||+d.times<1||+d.times>24){toast('날짜, 일정 이름, 반복 횟수(1~24)를 확인해 주세요.');return}let date=new Date(d.date+'T12:00:00');if(isNaN(+date)){toast('유효한 날짜를 입력해 주세요.');return}let teamIndex=state.teams.findIndex(t=>t.name===d.team);for(let k=0;k<+d.times;k++){let dt=new Date(date);if(d.repeat==='매주')dt.setDate(dt.getDate()+7*k);if(d.repeat==='2주마다')dt.setDate(dt.getDate()+14*k);if(d.repeat==='매월')dt.setMonth(dt.getMonth()+k);state.schedules.push({id:uid(),title:d.title.trim(),date:isoDate(dt),teamIndex,automatic:false})}month=d.date.slice(0,7);record('일정 추가',`${d.title} · ${d.times}회`);closeDialog();commit()}
function autoSchedule(){if(!state.teamCount){toast('먼저 팀을 구성해 주세요.');go('teams');return}let [y,m]=month.split('-').map(Number),dates=[];for(let d=1;d<=new Date(y,m,0).getDate();d++){let date=new Date(y,m-1,d),w=date.getDay();if(w>0&&w<6)dates.push(isoDate(date))}dialog('월별 팀 일정 자동 생성',`<p>${esc(month)}의 평일 <b>${dates.length}일</b>에 ${state.teamCount}개 팀을 차례대로 배정합니다.</p><p class="muted">이 달의 기존 자동 생성 일정만 교체하고, 직접 등록한 일정은 남깁니다. 공휴일은 별도로 확인해야 합니다.</p><div class="row" style="margin-top:15px"><button class="btn" onclick="confirmAutoSchedule()">일정 생성</button><button class="btn ghost" onclick="closeDialog()">취소</button></div>`)}
function confirmAutoSchedule(){let [y,m]=month.split('-').map(Number);state.schedules=state.schedules.filter(s=>!(s.automatic&&s.date.startsWith(month)));let offset=state.schedules.filter(s=>s.automatic).length%state.teamCount,k=0;for(let d=1;d<=new Date(y,m,0).getDate();d++){let dt=new Date(y,m-1,d);if(dt.getDay()===0||dt.getDay()===6)continue;state.schedules.push({id:uid(),title:'방송 당번',date:isoDate(dt),teamIndex:(k++ +offset)%state.teamCount,automatic:true})}record('팀 일정 자동 생성',month);closeDialog();commit('팀 일정이 균등하게 생성되었습니다.')}
function deleteSchedule(id){dialog('일정 삭제',`<p>정말 삭제하시겠습니까?</p><div class="row" style="margin-top:15px"><button class="btn danger" onclick="state.schedules=state.schedules.filter(s=>s.id!=='${id}');record('일정 삭제','${id}');closeDialog();commit()">예</button><button class="btn ghost" onclick="closeDialog()">아니오</button></div>`)}
function cleaning(){let ranked=[...state.cleaners].sort((a,b)=>a.count-b.count||a.name.localeCompare(b.name,'ko'));return `${titleBar('청소 당번 관리',`<button class="btn small" onclick="cleanerForm()">＋ 부원 추가</button>`)}<div class="notice">누적 청소 횟수가 가장 적은 부원을 다음 당번으로 추천합니다. 동일 횟수일 때는 이름순으로 표시하는 단순 규칙이며 AI 판단이 아닙니다.</div><div class="card"><h3>다음 추천 당번</h3>${ranked.length?`<h1 style="color:var(--blue);margin:8px 0">${esc(ranked[0].name)}</h1><p class="muted">현재 누적 ${ranked[0].count}회</p><button class="btn" style="margin-top:12px" onclick="assignCleaning('${ranked[0].id}')">청소 완료 기록</button>`:'<p class="empty">부원을 먼저 등록해 주세요.</p>'}</div><div class="card">${titleBar('청소 횟수 순위')}<div class="list-tight">${ranked.map(c=>`<div class="item row between"><span><b>${esc(c.name)}</b> · ${c.count}회</span><div class="row"><button class="btn secondary small" onclick="assignCleaning('${c.id}')">완료 +1</button><button class="btn danger small" onclick="deleteCleaner('${c.id}')">삭제</button></div></div>`).join('')||'<p class="empty">등록된 부원이 없습니다.</p>'}</div></div><section class="card">${titleBar('최근 청소 기록')}${state.cleanHistory.slice(0,10).map(c=>`<p class="activity">${esc(c.name)} · ${esc(c.date)}</p>`).join('')||'<p class="empty">아직 등록된 내용이 없습니다.</p>'}</section>`}
function cleanerForm(){dialog('청소 부원 추가',`<form onsubmit="handleForm(event,d=>{if(!valid(d,['name']))return;if(state.cleaners.some(c=>c.name===d.name.trim())){toast('이미 등록된 이름입니다.');return}state.cleaners.push({id:uid(),name:d.name.trim(),count:0});record('청소 부원 추가',d.name);closeDialog();commit()})">${field('부원 이름 또는 별명','name')}<div class="row"><button class="btn">추가</button><button class="btn ghost" type="button" onclick="closeDialog()">취소</button></div></form>`)}
function assignCleaning(id){let c=state.cleaners.find(x=>x.id===id);c.count++;state.cleanHistory.unshift({id:uid(),name:c.name,date:today()});record('청소 완료',c.name);commit('청소 횟수를 기록했습니다.')}
function deleteCleaner(id){dialog('부원 삭제',`<p>정말 삭제하시겠습니까? 누적 기록은 삭제되지만 과거 완료 내역은 유지됩니다.</p><div class="row" style="margin-top:15px"><button class="btn danger" onclick="state.cleaners=state.cleaners.filter(c=>c.id!=='${id}');record('청소 부원 삭제','${id}');closeDialog();commit()">예</button><button class="btn ghost" onclick="closeDialog()">아니오</button></div>`)}
function manualGate(){go('manual')}
function manual(){return `${titleBar('방송부 메뉴얼',`<button class="btn small" onclick="manualEdit()">메뉴얼 수정</button>`)}<div class="notice">메뉴얼 수정에는 PIN이 필요하며 수정 기록은 현재 브라우저에 저장됩니다.</div><section class="card"><small>마지막 수정 · ${esc(state.manualEditor)} / ${esc(state.manualAt)}</small><p class="pre" style="margin-top:16px">${esc(state.manual)}</p></section>`}
function manualEdit(){pinGate(()=>manualEditorForm(),true)}
function manualEditorForm(){dialog('메뉴얼 편집',`<form onsubmit="handleForm(event,d=>{if(!valid(d,['editor','content']))return;state.manual=d.content.trim();state.manualEditor=d.editor.trim();state.manualAt=new Date().toLocaleString('ko-KR');record('메뉴얼 수정',d.editor);closeDialog();commit()})">${field('수정자 이름','editor')}${textarea('메뉴얼 내용','content',state.manual)}<div class="row"><button class="btn">수정 저장</button><button class="btn ghost" type="button" onclick="closeDialog()">취소</button></div></form>`)}
function history(){return `${titleBar('활동 내역')}<div class="notice">물품 대여·반납과 그 밖의 주요 편집 활동을 기록합니다. 최대 최근 300건을 이 기기에 보관합니다.</div><section class="card"><h3>최근 활동</h3>${state.history.length?state.history.map(h=>`<div class="activity"><b>${esc(h.action)}</b> · ${esc(h.detail)}<br><small>${esc(h.date)}</small></div>`).join(''):'<p class="empty">아직 등록된 내용이 없습니다.</p>'}</section><section class="card"><h3>시연 데이터 관리</h3><p class="muted" style="margin:8px 0 12px">현재 브라우저의 기록 전체를 예시 상태로 초기화할 수 있습니다. 실행 시 되돌릴 수 없습니다.</p><button class="btn danger" onclick="resetForm()">시연 데이터 전체 초기화</button></section>`}
function resetForm(){dialog('시연 데이터 초기화',`<p>정말 초기화하시겠습니까? 새로 등록한 모든 물품, 대여, 프로젝트, 팀 일정과 메뉴얼 수정 내역을 잃습니다.</p><div class="row" style="margin-top:15px"><button class="btn danger" onclick="state=seed();CATS=state.categories;save();closeDialog();page='home';search='';category='전체';inventoryTab='list';render()">예, 초기화</button><button class="btn ghost" onclick="closeDialog()">아니오</button></div>`)}
function pinGate(callback,manualOnly=false){
 if(!authenticated)return;
 // Manual viewing is unrestricted once inside the site. Editing requires PIN.
 dialog('메뉴얼 편집 PIN 확인',`<p class="muted" style="margin-bottom:17px">메뉴얼을 수정하려면 PIN을 다시 입력해 주세요.</p><form onsubmit="handleForm(event,d=>checkPin(d))">${field('방송부 PIN','pin','','password')}<div class="row"><button class="btn" type="submit">PIN 확인</button><button class="btn ghost" type="button" onclick="closeDialog()">취소</button></div></form>`);
 window._afterPin=callback;
}
function checkPin(d){
 if(!authenticated)return;
 if(String(d.pin||'')!==ENTRY_PIN){formError('PIN이 일치하지 않습니다.');return}
 closeDialog();
 if(typeof window._afterPin==='function'){const next=window._afterPin;window._afterPin=null;next()}
}

function render(){if(!authenticated)return;buttons();el('app').innerHTML=navIntro()+({home,inventory,projects,songs:()=>board('songs'),stories:()=>board('stories'),teams,schedule,cleaning,manual,history}[page]||home)()}


render();

</script></body></html>
